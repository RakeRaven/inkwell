name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Inkwell.xcodeproj -scheme Inkwell -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Inkwell.app Payload/
          zip -qry Inkwell.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Inkwell-ipa
          path: Inkwell.ipa
